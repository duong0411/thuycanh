name: Build APK & IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/thuycanh-iot-stem.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thuycanh-apk
          path: dist/thuycanh-iot-stem.apk

  ios-ipa:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # CI không có Apple cert → build ios unsigned rồi đóng gói .ipa
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          mkdir -p dist Payload
          APP_PATH=""
          for candidate in \
            build/ios/iphoneos/Runner.app \
            build/ios/Release-iphoneos/Runner.app \
            "$(find build/ios -name 'Runner.app' -type d | head -n 1)"; do
            if [ -d "$candidate" ]; then
              APP_PATH="$candidate"
              break
            fi
          done
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found"
            find build/ios -maxdepth 5 -type d -print || true
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          rm -rf Payload/*
          cp -R "$APP_PATH" Payload/
          (cd . && zip -qry dist/thuycanh-iot-stem.ipa Payload)
          ls -lh dist/thuycanh-iot-stem.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: thuycanh-ipa
          path: dist/thuycanh-iot-stem.ipa

  release:
    name: GitHub Release
    needs: [android-apk, ios-ipa]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: thuycanh-apk
          path: dist

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: thuycanh-ipa
          path: dist

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Thủy Canh IoT STEM v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/thuycanh-iot-stem.apk
            dist/thuycanh-iot-stem.ipa
          body: |
            ## Tải app
            - **Android APK:** `thuycanh-iot-stem.apk` — cài trực tiếp trên điện thoại
            - **iOS IPA:** `thuycanh-iot-stem.ipa` — bản CI chưa codesign (cần ký bằng Apple Developer / Xcode trước khi cài máy thật)

            ## Cảnh báo điện thoại
            App báo khi mực nước đầy / thấp hoặc pH ngoài 5.5–6.5, kể cả lúc tắt app (Android foreground service + MQTT).
            Khi có mạng trở lại mà còn cảnh báo, điện thoại sẽ báo lại. Không cần sửa firmware ESP32.

            ## STEM ESP32
            App kết nối MQTT chipId `790` — hệ thống thủy canh IoT.
            Firmware: `firmware/ThuyCanh_ESP32.ino`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
