name: thuycanh_app
description: "STEM app giám sát hệ thống thủy canh IoT ESP32 qua MQTT (AloT)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mqtt_client: ^10.11.11
  provider: ^6.1.5+1
  flutter_animate: ^4.5.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: 19.4.0
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
